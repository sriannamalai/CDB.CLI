version: 2

project_name: cdb

before:
  hooks:
    - go mod tidy

builds:
  # macOS needs cgo for the Keychain credential backend. Verified: with
  # CGO_ENABLED=0 the keychain backend disappears from
  # keyring.AvailableBackends() and secrets fall back to an encrypted file.
  # This build runs on a macOS runner, which can produce both arm64 and amd64.
  - id: cdb-darwin
    main: ./cmd/cdb
    binary: cdb
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # Linux (secret-service, kwallet) and Windows (wincred) backends are pure Go,
  # so those builds stay static.
  - id: cdb-static
    main: ./cmd/cdb
    binary: cdb
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    ids: [cdb-darwin, cdb-static]
    name_template: "cdb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Pushing the cask and the scoop manifest needs a token with contents:write
# on sriannamalai/homebrew-tap and sriannamalai/scoop-bucket; GITHUB_TOKEN
# cannot write to other repositories. The TAP_GITHUB_TOKEN repository secret
# holds that token (release.yml maps it to HOMEBREW_TAP_GITHUB_TOKEN and
# SCOOP_GITHUB_TOKEN). skip_upload is templated so a release still succeeds,
# without the tap and bucket, whenever the token is unset.
homebrew_casks:
  - name: cdb
    repository:
      owner: sriannamalai
      name: homebrew-tap
      # The cask and scoop pipes only use a personal access token when it is
      # named here; otherwise they fall back to GITHUB_TOKEN, which cannot
      # write to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sriannamalai/CDB.CLI"
    description: "Interactive CouchDB command line client"
    license: "Apache-2.0"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # Strip the quarantine attribute Homebrew puts on a downloaded binary
        # so macOS runs it without a Gatekeeper prompt. Only on macOS: Linux
        # has no /usr/bin/xattr and system_command cannot spawn a missing
        # file, which failed the whole install.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cdb"]
          end

scoops:
  - name: cdb
    repository:
      owner: sriannamalai
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: "https://github.com/sriannamalai/CDB.CLI"
    description: "Interactive CouchDB command line client"
    license: "Apache-2.0"
    skip_upload: '{{ if index .Env "SCOOP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

release:
  draft: false
  prerelease: auto
  # Re-running the release workflow (for example after enabling the tap
  # token) must not fail on assets that the first run already uploaded.
  replace_existing_artifacts: true
