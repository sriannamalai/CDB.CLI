version: 2

project_name: cdb

before:
  hooks:
    - go mod tidy

builds:
  # macOS needs cgo for the Keychain credential backend. Verified: with
  # CGO_ENABLED=0 the keychain backend disappears from
  # keyring.AvailableBackends() and secrets fall back to an encrypted file.
  # This build runs on a macOS runner, which can produce both arm64 and amd64.
  - id: cdb-darwin
    main: ./cmd/cdb
    binary: cdb
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # Linux (secret-service, kwallet) and Windows (wincred) backends are pure Go,
  # so those builds stay static.
  - id: cdb-static
    main: ./cmd/cdb
    binary: cdb
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    ids: [cdb-darwin, cdb-static]
    name_template: "cdb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# The tap (sriannamalai/homebrew-tap) and bucket (sriannamalai/scoop-bucket)
# repositories don't exist yet, and pushing to them needs a token with
# contents:write on both that GITHUB_TOKEN doesn't have. Until that's set up,
# skip_upload keeps a release from failing after the binaries are already
# built: it's templated so it evaluates to "true" (skip) whenever the
# matching env var is unset or empty, and "false" (upload) once it's set.
#
# To enable the tap once ready:
#   1. Create sriannamalai/homebrew-tap and sriannamalai/scoop-bucket on GitHub.
#   2. Generate a fine-grained PAT with contents:write on both repositories.
#   3. Set it as the TAP_GITHUB_TOKEN repository secret (see
#      .github/workflows/release.yml, which maps it to
#      HOMEBREW_TAP_GITHUB_TOKEN and SCOOP_GITHUB_TOKEN for goreleaser).
homebrew_casks:
  - name: cdb
    repository:
      owner: sriannamalai
      name: homebrew-tap
    homepage: "https://github.com/sriannamalai/CDB.CLI"
    description: "Interactive CouchDB command line client"
    license: "Apache-2.0"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cdb"]
          end

scoops:
  - name: cdb
    repository:
      owner: sriannamalai
      name: scoop-bucket
    homepage: "https://github.com/sriannamalai/CDB.CLI"
    description: "Interactive CouchDB command line client"
    license: "Apache-2.0"
    skip_upload: '{{ if index .Env "SCOOP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

release:
  draft: false
  prerelease: auto
  # Re-running the release workflow (for example after enabling the tap
  # token) must not fail on assets that the first run already uploaded.
  replace_existing_artifacts: true
